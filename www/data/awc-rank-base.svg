<svg xmlns="http://www.w3.org/2000/svg" height="100" width="470" viewbox="0 0 470 100">
    <rect x="50" y="0" width="370" height="100" fill="#1e293a"/>
    <circle cx="420" cy="50" r="50" fill="$rankColor$"/>
    <!-- AWC logo -->
    <image x="0" y="0" height="100" width="100" href="data:image/png;base64,">
    </image>
    <style>
        .label {
            font: bold 20px sans-serif;
            fill: white;
            text-anchor: middle;
        }
        .placement {
            fill: $placementColor$;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .placement-1-d,
        .placement-2-d {
            font: bold 50px sans-serif;
        }
        
        .placement-3-d {
            font: bold 33px sans-serif;
        }
        .placement-4-d {
            font: bold 30px sans-serif;
        }
    </style>
    <text x="420" y="55" class="placement placement-$digits$-d">#$placement$</text>
    <text x="235" y="45" class="label">$username$</text>
    <text x="235" y="65" class="label">$points$p - $rank$</text>
</svg>